<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabarito Mental — Mapas que viram flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,680&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141B2E;
    --ink-soft:#4A5570;
    --paper:#F3ECDC;
    --paper-2:#E9DFC4;
    --paper-line: rgba(20,27,46,0.09);
    --accent:#3E7C59;
    --brass:#B98B2A;
    --crimson:#9B3A34;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(20,27,46,0.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(20,27,46,0.05), transparent 40%),
      repeating-linear-gradient(0deg, rgba(20,27,46,0.015) 0px, rgba(20,27,46,0.015) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{ outline: 3px solid var(--brass); outline-offset: 2px; }

  /* ---------- Nav ---------- */
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px clamp(16px,4vw,48px);
    background: var(--ink);
    color: var(--paper);
    position:sticky; top:0; z-index:20;
    border-bottom: 3px solid var(--brass);
    flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-seal{
    width:34px; height:34px; border-radius:50%;
    background: conic-gradient(var(--brass), var(--accent), var(--brass));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:680; font-size:14px; color:var(--ink);
    flex:none;
  }
  .brand-name{ font-family:'Fraunces', serif; font-weight:560; font-size:19px; }
  .brand-sub{ font-size:11px; color:#C9C2AC; margin-top:-2px; }
  .nav-right{ display:flex; align-items:center; gap:10px; font-size:13px; color:#D8D2BE; flex-wrap:wrap;}
  .back-btn{
    background:transparent; border:1px solid rgba(243,236,220,0.35); color:var(--paper);
    padding:8px 14px; border-radius:999px; font-size:13px; display:flex; align-items:center; gap:8px;
    transition: background .15s ease, border-color .15s ease;
  }
  .back-btn:hover{ background: rgba(243,236,220,0.1); border-color: var(--brass); }

  main{ padding: clamp(20px,4vw,48px); max-width:1180px; margin:0 auto; }

  /* ---------- Home ---------- */
  .hero{
    padding: clamp(28px,6vw,56px) clamp(16px,4vw,40px) clamp(8px,2vw,16px);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero .hero-watermark{
    position:absolute !important;
    top:50%; left:50%; width:min(720px,140vw); height:min(720px,140vw);
    transform:translate(-50%,-50%);
    opacity:0.05; pointer-events:none; z-index:0;
  }
  .hero > *{ position:relative; z-index:1; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--accent); margin-bottom:14px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .eyebrow::before, .eyebrow::after{ content:''; width:22px; height:1px; background:var(--accent); opacity:0.5; }
  .hero h1{
    font-size: clamp(32px,5.2vw,54px); font-weight:560; line-height:1.08; margin:0 0 18px;
  }
  .hero h1 em{ font-style:normal; color:var(--accent); }
  .hero p{ max-width:620px; margin:0 auto 26px; color:var(--ink-soft); font-size:16px; line-height:1.6; }
  .stat-row{ display:flex; gap:0; justify-content:center; flex-wrap:wrap; margin-top:8px;}
  .stat{ text-align:center; padding:0 28px; position:relative; }
  .stat + .stat::before{ content:''; position:absolute; left:0; top:6px; bottom:6px; width:1px; background:var(--paper-line); }
  .stat b{ display:block; font-family:'Fraunces',serif; font-size:28px; }
  .stat span{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; }

  .live-strip{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    margin: 30px 0 6px;
  }
  .live-pill{
    display:flex; align-items:center; gap:8px;
    background:var(--paper-2); border:1px solid var(--paper-line);
    border-radius:999px; padding:8px 16px; font-size:12.5px; color:var(--ink-soft);
  }
  .live-pill b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .live-pill .dot{ width:7px; height:7px; border-radius:50%; flex:none; }

  .section-label{
    display:flex; align-items:center; gap:12px; margin: 40px 0 18px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--paper-line); }

  .seal-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px; margin-top:8px;
  }
  .seal-card{
    background: var(--paper-2);
    border:1px solid var(--paper-line);
    border-radius: var(--radius);
    padding:22px 20px 20px;
    text-align:left;
    display:flex; flex-direction:column; gap:14px;
    box-shadow: 0 1px 0 rgba(20,27,46,0.04);
    transition: transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease, border-color .2s ease;
    position:relative;
    border-top:3px solid var(--card-accent, var(--paper-line));
    overflow:hidden;
  }
  @media (prefers-reduced-motion: no-preference){
    .seal-card{
      opacity:0; transform:translateY(10px);
      animation: rise .5s ease forwards;
    }
    .seal-card:nth-child(1){animation-delay:.02s} .seal-card:nth-child(2){animation-delay:.08s}
    .seal-card:nth-child(3){animation-delay:.14s} .seal-card:nth-child(4){animation-delay:.20s}
    .seal-card:nth-child(5){animation-delay:.26s} .seal-card:nth-child(6){animation-delay:.32s}
    .seal-card:nth-child(7){animation-delay:.38s}
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0);} }
  .seal-card::after{
    content:''; position:absolute; top:-40px; right:-40px; width:110px; height:110px; border-radius:50%;
    background:var(--card-accent, transparent); opacity:0.06; pointer-events:none;
  }
  .seal-card:hover{
    transform:translateY(-5px) scale(1.012);
    box-shadow: 0 18px 34px -18px rgba(20,27,46,0.5);
    border-color: var(--card-accent, var(--paper-line));
  }
  .seal-card:hover .seal{ transform: rotate(-6deg) scale(1.05); }

  .seal-top{ display:flex; align-items:center; gap:14px; }
  .seal{
    width:52px; height:52px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:680; font-size:16px; color:#fff;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.2), inset 0 0 0 6px rgba(255,255,255,0.08), 0 3px 8px -3px rgba(0,0,0,0.35);
    transition: transform .3s ease;
  }
  .seal-card h3{ margin:0; font-size:18px; font-weight:560; line-height:1.2;}
  .seal-card .count{ font-size:12px; color:var(--ink-soft); }
  .seal-card p.tagline{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5; flex:1; }
  .enter-row{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; padding-top:12px; border-top:1px solid var(--paper-line); }
  .enter-row .go{ font-weight:600; }
  .mastery-row{ display:flex; align-items:center; gap:10px; }
  .mastery-track{ flex:1; height:5px; border-radius:99px; background:rgba(20,27,46,0.08); overflow:hidden; }
  .mastery-fill{ height:100%; border-radius:99px; }
  .mastery-label{ font-size:11px; color:var(--ink-soft); white-space:nowrap; font-family:'IBM Plex Mono',monospace; }
  .due-badge{ font-size:10.5px; font-family:'IBM Plex Mono',monospace; background:var(--brass); color:#fff; padding:2px 8px; border-radius:999px; }

  /* ---------- Stats ---------- */
  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:8px; }
  .stats-card{ background:var(--paper-2); border:1px solid var(--paper-line); border-radius:var(--radius); padding:20px; text-align:center; }
  .stats-big{ font-family:'Fraunces',serif; font-size:34px; font-weight:680; line-height:1; }
  .stats-label{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .bar-list{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:flex; align-items:center; gap:12px; }
  .bar-label{ width:170px; flex:none; font-size:13px; }
  .bar-track{ flex:1; height:8px; border-radius:99px; background:var(--paper-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; }
  .bar-pct{ width:42px; text-align:right; font-size:12px; color:var(--ink-soft); }
  .miss-table{ display:flex; flex-direction:column; gap:8px; }
  .miss-row{ display:flex; align-items:center; gap:12px; background:var(--paper-2); border:1px solid var(--paper-line); border-radius:10px; padding:10px 14px; }
  .miss-seal{ width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; }
  .miss-info{ flex:1; min-width:0; }
  .miss-term{ font-size:13.5px; font-weight:600; }
  .miss-parent{ font-size:11.5px; color:var(--ink-soft); }
  .miss-count{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--crimson); font-weight:600; }

  /* ---------- Import ---------- */
  .import-guide{ background:var(--paper-2); border:1px solid var(--paper-line); border-radius:12px; padding:16px 18px; margin-bottom:18px; font-size:13.5px; }
  .import-example{ background:#FBF7EC; border:1px solid var(--paper-line); border-radius:8px; padding:12px 14px; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.6; overflow-x:auto; color:var(--ink-soft); white-space:pre-wrap; margin:10px 0 0; }
  .import-textarea{ width:100%; min-height:180px; border:1px solid var(--paper-line); border-radius:12px; padding:14px; font-family:'IBM Plex Mono',monospace; font-size:13px; background:#FBF7EC; color:var(--ink); resize:vertical; }
  .import-msg{ font-size:13px; margin:10px 0; min-height:18px; font-weight:600; }

  /* ---------- Subject header ---------- */
  .crumbs{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }
  .crumbs button{ background:none; border:none; color:var(--accent); font-size:12.5px; padding:0; font-weight:600; }
  .subject-head{ display:flex; align-items:center; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
  .subject-head .seal{ width:60px; height:60px; font-size:18px; }
  .subject-head h2{ margin:0; font-size:clamp(22px,3.2vw,30px); font-weight:560; }
  .subject-head .count{ font-size:13px; color:var(--ink-soft); margin-top:2px; }

  .mode-toggle{
    display:inline-flex; background:var(--paper-2); border:1px solid var(--paper-line);
    border-radius:999px; padding:4px; margin-left:auto; gap:2px;
  }
  .mode-toggle button{
    border:none; background:transparent; padding:8px 16px; border-radius:999px; font-size:13px;
    color: var(--ink-soft); font-weight:500; transition: background .15s ease, color .15s ease;
  }
  .mode-toggle button.active{ background: var(--ink); color: var(--paper); }

  /* ---------- Mind map ---------- */
  .map-shell{ position:relative; padding-top:36px; }
  .connector-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .center-node{
    width:150px; height:150px; border-radius:50%; margin:0 auto 46px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:15px; line-height:1.25;
    padding:10px; position:relative; z-index:2;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,0.16), 0 10px 24px -12px rgba(0,0,0,0.4);
  }
  .branches{
    display:flex; flex-wrap:wrap; gap:22px; justify-content:center; position:relative; z-index:2;
  }
  .node-card{ width:190px; height:172px; perspective:1000px; cursor:pointer; }
  .card-inner{
    position:relative; width:100%; height:100%; transition: transform .5s cubic-bezier(.2,.7,.3,1);
    transform-style:preserve-3d; border-radius:12px;
  }
  .node-card.flipped .card-inner{ transform: rotateY(180deg); }
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:14px; border:1px solid var(--paper-line);
    background: #FBF7EC;
    box-shadow: 0 8px 18px -14px rgba(20,27,46,0.5);
  }
  .card-front{ font-family:'Fraunces',serif; font-weight:560; font-size:15.5px; line-height:1.3; }
  .card-front .flip-hint{ position:absolute; bottom:8px; right:10px; font-size:10px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
  .card-back{ transform: rotateY(180deg); font-size:11.8px; line-height:1.42; color:var(--ink-soft); overflow-y:auto; gap:8px; }
  .card-back .trap{ font-size:10.8px; background:rgba(155,58,52,0.1); color:var(--crimson); border-radius:8px; padding:6px 8px; text-align:left; }
  .card-back .trap b{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:2px;}
  .drill-btn{
    margin-top:6px; border:1px solid var(--paper-line); background:var(--paper-2); color:var(--ink);
    font-size:10.5px; padding:5px 10px; border-radius:999px; font-weight:600;
  }
  .node-card:hover .card-front{ box-shadow: 0 12px 22px -12px rgba(20,27,46,0.5); }

  /* sub-branch cards (no drill, just def) */
  .node-card.leaf{ height:150px; }

  /* ---------- Flashcard mode ---------- */
  .flash-wrap{ display:flex; flex-direction:column; align-items:center; gap:22px; padding-top:10px; }
  .flash-progress{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--ink-soft); }
  .flash-progress .mono{ font-size:13px; }
  .track{ width:220px; height:5px; border-radius:99px; background:var(--paper-2); overflow:hidden; }
  .track-fill{ height:100%; background:var(--accent); transition:width .3s ease; }
  .flash-card{
    width:min(560px,90vw); height:280px; perspective:1400px; cursor:pointer;
  }
  .flash-card .card-inner{ transition: transform .5s cubic-bezier(.2,.7,.3,1); border-radius:18px; }
  .flash-card .card-face{
    border-radius:18px; padding:32px;
    background: #FBF7EC;
    box-shadow: 0 22px 40px -22px rgba(20,27,46,0.5);
  }
  .flash-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:10px;}
  .flash-card .card-front{ font-size:clamp(19px,2.8vw,25px); font-weight:560; }
  .flash-card .card-back{ font-size:15px; line-height:1.6; }
  .tap-hint{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
  .flash-controls{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; }
  .fbtn{
    border:1px solid var(--paper-line); background:var(--paper-2); color:var(--ink);
    padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:500;
    transition: background .15s ease, transform .1s ease;
  }
  .fbtn:hover{ background:#fff; }
  .fbtn:active{ transform:scale(0.97); }
  .fbtn.primary{ background: var(--ink); color: var(--paper); border-color:var(--ink); }
  .fbtn.know{ background: var(--accent); color:#fff; border-color:var(--accent); }
  .fbtn.review{ background: var(--crimson); color:#fff; border-color:var(--crimson); }
  .session-tally{ display:flex; gap:18px; font-size:12.5px; color:var(--ink-soft); }
  .session-tally b{ color:var(--ink); }
  .deck-done{ text-align:center; max-width:420px; }
  .deck-done h3{ margin:0 0 8px; font-size:22px; }
  .deck-done p{ color:var(--ink-soft); font-size:14px; margin:0 0 18px; }

  footer{ text-align:center; padding:36px 20px 50px; font-size:12px; color:var(--ink-soft); }

  @media (max-width:640px){
    .node-card{ width:44vw; min-width:150px; height:190px; }
    .center-node{ width:120px; height:120px; font-size:13px; }
    .subject-head .mode-toggle{ margin-left:0; width:100%; }
    .subject-head .mode-toggle button{ flex:1; text-align:center; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">
    <div class="brand-seal">GM</div>
    <div>
      <div class="brand-name">Gabarito Mental</div>
      <div class="brand-sub">mapas que viram cartão de memória</div>
    </div>
  </div>
  <div class="nav-right" id="navRight"></div>
</nav>
<main id="app"></main>
<footer>Conteúdo de revisão — não substitui a leitura da lei seca e da doutrina. Seu progresso de revisão fica salvo neste navegador (localStorage), não é enviado a nenhum servidor.
  <div style="margin-top:8px;"><button onclick="resetAllProgress()" style="background:none;border:none;color:var(--crimson);text-decoration:underline;font-size:12px;cursor:pointer;">Reiniciar todo o progresso salvo</button></div>
</footer>

<script>
const SUBJECTS = [
  {
    id:'administrativo', nome:'Direito Administrativo', selo:'AD', cor:'#3E7C59',
    tagline:'Princípios, atos, poderes e a estrutura da máquina pública.',
    topicos:[
      {t:'Princípios (LIMPE)', d:'Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência regem toda a atuação da Administração Pública (art. 37, caput, CF).',
        pegadinha:'Bancas trocam "moralidade" por "honestidade" — moralidade é standard jurídico, exigível judicialmente, não apenas ético.',
        subs:[
          {t:'Legalidade', d:'Administrador só pode agir conforme autorizado por lei; ao particular, o que a lei não proíbe é permitido.'},
          {t:'Impessoalidade', d:'Atuação sem favorecimentos; atos são imputados ao órgão, não à pessoa do agente (art. 37, §1º veda promoção pessoal).'},
          {t:'Eficiência', d:'Introduzido pela EC 19/98; exige boa qualidade, presteza e rendimento funcional na prestação do serviço público.'},
        ]},
      {t:'Atos Administrativos', d:'Manifestação da Administração com atributos próprios: presunção de legitimidade, autoexecutoriedade, imperatividade e tipicidade.',
        pegadinha:'Nem todo ato é autoexecutório — cobrança de multa não paga exige execução fiscal judicial.',
        subs:[
          {t:'Presunção de Legitimidade', d:'Presume-se que o ato foi praticado conforme a lei, até prova em contrário — inverte o ônus da prova ao particular.'},
          {t:'Autoexecutoriedade', d:'Administração executa suas decisões sem necessidade de ordem judicial prévia, quando prevista em lei ou urgência.'},
          {t:'Tipicidade', d:'Ato deve corresponder a figura definida em lei; decorre da legalidade e da segurança jurídica.'},
        ]},
      {t:'Poderes Administrativos', d:'Vinculado, Discricionário, Hierárquico, Disciplinar, Regulamentar e de Polícia — instrumentos do exercício da função administrativa.',
        pegadinha:'Discricionariedade não é liberdade total: o mérito pode ser controlado pelo Judiciário quanto à legalidade, mas não substituído.',
        subs:[
          {t:'Poder Vinculado', d:'Lei determina todos os elementos do ato, sem margem de escolha para o administrador.'},
          {t:'Poder Discricionário', d:'Lei confere margem de escolha quanto a oportunidade e conveniência (mérito administrativo), dentro dos limites legais.'},
          {t:'Poder de Polícia', d:'Restringe direitos individuais em favor do interesse coletivo (ex.: licenças, fiscalização, multas).'},
        ]},
      {t:'Administração Direta e Indireta', d:'Direta: entes federativos. Indireta: autarquias, fundações públicas, empresas públicas e sociedades de economia mista, criadas por lei.',
        pegadinha:'Fundações públicas de direito privado seguem regime semelhante ao das empresas estatais, não ao das autarquias.',
        subs:[
          {t:'Autarquias', d:'Pessoa jurídica de direito público, criada por lei específica, com capacidade de autoadministração e patrimônio próprio.'},
          {t:'Empresas Públicas', d:'Capital 100% público, podem ter qualquer forma societária; competência da Justiça Federal em regra.'},
          {t:'Sociedades de Economia Mista', d:'Capital misto (público e privado), sempre sociedade anônima; competência da Justiça Estadual em regra.'},
        ]},
      {t:'Licitações e Contratos', d:'A Lei 14.133/2021 disciplina as modalidades (pregão, concorrência, diálogo competitivo etc.) e os princípios do processo licitatório.',
        pegadinha:'Inexigibilidade tem rol exemplificativo (ex.: notória especialização); dispensa tem rol taxativo na lei.',
        subs:[

/* ---------- Spaced repetition (Leitner, 5 caixas) + persistência ---------- */
const STORAGE_KEY = 'gabaritoMentalProgress_v1';
const BOX_DAYS = [0,1,2,4,9,21]; // dias até a próxima revisão, por caixa (0..5)
let storageOK = true;
let progress = {};
try{
  const raw = localStorage.getItem(STORAGE_KEY);
  progress = raw ? JSON.parse(raw) : {};
}catch(e){ storageOK = false; progress = {}; }

function saveProgress(){
  if(!storageOK) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
  catch(e){ storageOK = false; }
}
function cardKey(subId, ti, si){ return subId+':'+ti+':'+si; }
function getCardState(key){ return progress[key] || {box:0, due:0, reps:0}; }
function setCardState(key, st){ progress[key] = st; saveProgress(); }

function subjectStats(sub){
  const leaves = flattenLeaves(sub);
  const now = Date.now();
  let mastered=0, due=0;
  leaves.forEach(l=>{
    const st = getCardState(l.key);
    if(st.box>=5) mastered++;
    if(st.due<=now) due++;
  });
  return {total:leaves.length, mastered, due};
}

/* ---------- Sequência de estudo (streak) ---------- */
const STUDY_KEY = 'gabaritoMentalStudyDays_v1';
let studyDays = new Set();
try{
  const raw = localStorage.getItem(STUDY_KEY);
  studyDays = new Set(raw ? JSON.parse(raw) : []);
}catch(e){}

function todayStr(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function logStudyToday(){
  const t = todayStr();
  if(!studyDays.has(t)){
    studyDays.add(t);
    try{ localStorage.setItem(STUDY_KEY, JSON.stringify([...studyDays])); }catch(e){}
  }
}
function computeStreak(){
  let streak=0;
  let d = new Date();
  while(studyDays.has(todayStr(d))){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

/* ---------- Ranking de tópicos mais errados ---------- */
function topMissed(limit){
  const all=[];
  const subjectsForRanking = customTopics.length ? [...SUBJECTS, getCustomSubject()] : SUBJECTS;
  subjectsForRanking.forEach(sub=>{
    flattenLeaves(sub).forEach(l=>{
      const st = getCardState(l.key);
      if(st.lapses) all.push({sub, l, lapses:st.lapses});
    });
  });
  all.sort((a,b)=>b.lapses-a.lapses);
  return all.slice(0, limit);
}

  };

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function parseImportText(text){
  const blocks = String(text).split(/\n(?=#\s)/).map(b=>b.trim()).filter(Boolean);
  const topics = [];
  blocks.forEach(block=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    if(lines.length===0 || !lines[0].startsWith('#')) return;
    const title = lines[0].replace(/^#\s*/,'').trim();
    if(!title) return;
    const defLines = [];
    let pegadinha = '';
    const subs = [];
    for(let i=1;i<lines.length;i++){
      const line = lines[i];
      if(line.startsWith('!')){
        pegadinha += (pegadinha ? ' ' : '') + line.replace(/^!\s*/,'').trim();
      } else if(line.startsWith('-')){
        const raw = line.replace(/^-\s*/,'');
        const parts = raw.split('::');
        if(parts.length>=2){
          subs.push({t:parts[0].trim(), d:parts.slice(1).join('::').trim()});
        } else if(raw.trim()){
          subs.push({t:`Sub-ramo ${subs.length+1}`, d:raw.trim()});
        }
      } else {
        defLines.push(line);
      }
    }
    const d = defLines.join(' ').trim() || title;
    if(subs.length===0) subs.push({t:title, d:d});
    topics.push({t:title, d, pegadinha: pegadinha || 'Nenhuma pegadinha cadastrada para este tópico.', subs});
  });
  return topics;
}

function doImport(){
  const parsed = parseImportText(importDraft);
  if(parsed.length===0){
    lastImportMsg = {text:'Não encontrei nenhum tópico válido. Confira se cada bloco começa com "# Título".', ok:false};
  } else {
    customTopics = customTopics.concat(parsed);
    saveCustom();
    lastImportMsg = {text:`${parsed.length} tópico(s) importado(s) com sucesso.`, ok:true};
    importDraft = '';
  }
  render();
}
function deleteCustomTopic(i){
  if(!confirm('Remover este tópico importado? Isso também reinicia o progresso salvo de "Meus Tópicos".')) return;
  customTopics.splice(i,1);
  saveCustom();
  Object.keys(progress).forEach(k=>{ if(k.startsWith('custom:')) delete progress[k]; });
  saveProgress();
  delete flashState['custom'];
  render();
}

function openSubject(id){ state = {view:'subject', subjectId:id, topicIdx:null, mode:'map'}; render(); }
function openSubmap(ti){ state.view='submap'; state.topicIdx=ti; render(); }

function setMode(mode){
  state.mode = mode;
  if(mode==='flash' && !flashState[state.subjectId]) initFlash(state.subjectId);
  render();
}

function flattenLeaves(sub){
  const out=[];
  sub.topicos.forEach((top,ti)=>top.subs.forEach((s,si)=>out.push({ti,si,parent:top.t,t:s.t,d:s.d,key:cardKey(sub.id,ti,si)})));
  return out;
}

function initFlash(id, forceAll){
  const sub = findSubject(id);
  const leaves = flattenLeaves(sub);
  const now = Date.now();
  let pool = forceAll ? leaves.slice() : leaves.filter(l=>getCardState(l.key).due<=now);
  shuffleArr(pool);
  pool.sort((a,b)=>getCardState(a.key).box - getCardState(b.key).box); // caixas mais fracas primeiro
  flashState[id] = {
    queue: pool.map(l=>l.key),
    pos:0, know:0, review:0,
    done: pool.length===0,
    empty: pool.length===0 && !forceAll,
  };
}
function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
}

function render(){
  let rightHtml = '';
  if(state.view==='submap'){
    rightHtml += `<button class="back-btn" onclick="backToSubject()">← ${findSubject(state.subjectId).nome}</button>`;
  }
  if(state.view!=='home'){
    rightHtml += `<button class="back-btn" onclick="goHome()">Todas as disciplinas</button>`;
  }
  if(state.view!=='stats'){
    rightHtml += `<button class="back-btn" onclick="openStats()">📊 Estatísticas</button>`;
  }
  if(state.view!=='import'){
    rightHtml += `<button class="back-btn" onclick="openImport()">⬆️ Importar</button>`;
  }
  navRight.innerHTML = rightHtml;

  if(state.view==='home'){ renderHome(); return; }
  if(state.view==='stats'){ renderStats(); return; }
  if(state.view==='import'){ renderImport(); return; }
  const sub = findSubject(state.subjectId);
  if(state.view==='submap'){ renderSubmap(sub, state.topicIdx); return; }
  if(state.mode==='map') renderMap(sub); else renderFlash(sub);
}

    <div class="section-label">Disciplinas</div>
    <div class="seal-grid">
      ${SUBJECTS.map(s=>{
        const stats = subjectStats(s);
        const pct = stats.total ? Math.round((stats.mastered/stats.total)*100) : 0;
        return `
        <button class="seal-card" style="--card-accent:${s.cor}" onclick="openSubject('${s.id}')">

function drawConnectors(color){
  const shell = document.getElementById('mapShell');
  const svg = document.getElementById('connSvg');
  const center = document.querySelector('.center-node');
  const cards = document.querySelectorAll('.node-card');
  if(!shell || !center) return;
  const shellRect = shell.getBoundingClientRect();
  const cRect = center.getBoundingClientRect();
  const cx = cRect.left + cRect.width/2 - shellRect.left;
  const cy = cRect.top + cRect.height - shellRect.top;
  let paths = '';
  cards.forEach(card=>{
    const r = card.getBoundingClientRect();
    const nx = r.left + r.width/2 - shellRect.left;
    const ny = r.top - shellRect.top;
    const midY = cy + (ny-cy)*0.5;
    paths += `<path d="M${cx},${cy} C${cx},${midY} ${nx},${midY} ${nx},${ny}" stroke="${color}" stroke-width="1.6" fill="none" opacity="0.4"/>`;
  });
  svg.innerHTML = paths;
  svg.setAttribute('width', shellRect.width);
  svg.setAttribute('height', shellRect.height);
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

function renderFlash(sub){
  const fs = flashState[sub.id];
  const leaves = flattenLeaves(sub);
  const stats = subjectStats(sub);
  const headHtml = `
    <div class="subject-head">
      <div class="seal" style="background:${sub.cor}">${sub.selo}</div>
      <div>
        <h2>${sub.nome}</h2>
        <div class="count">Modo flashcard · repetição espaçada · ${stats.mastered}/${stats.total} dominados</div>
      </div>
      <div class="mode-toggle">
        <button onclick="setMode('map')">Mapa mental</button>
        <button class="active" onclick="setMode('flash')">Flashcards</button>
      </div>
    </div>`;

  if(fs.empty){
    app.innerHTML = headHtml + `
      <div class="flash-wrap">
        <div class="deck-done">
          <h3>Tudo em dia por aqui ✅</h3>
          <p>Nenhum cartão está vencido para revisão hoje. ${stats.mastered} de ${stats.total} já estão no nível máximo de domínio.</p>
          <button class="fbtn primary" onclick="restartFlash('${sub.id}')">Revisar mesmo assim</button>
        </div>
      </div>`;
    return;
  }

  if(fs.done){
    app.innerHTML = headHtml + `
      <div class="flash-wrap">
        <div class="deck-done">
          <h3>Sessão concluída</h3>
          <p>Sei: <b>${fs.know}</b> · A revisar: <b>${fs.review}</b>. Os prazos de revisão foram atualizados — volte quando vencerem.</p>
          <button class="fbtn primary" onclick="restartFlash('${sub.id}')">Revisar tudo de novo</button>
          <div style="margin-top:14px;"><button class="fbtn" onclick="resetSubjectProgress('${sub.id}')" style="font-size:12px;">Reiniciar progresso desta disciplina</button></div>
        </div>
      </div>`;
    return;
  }

  const key = fs.queue[fs.pos];
  const leaf = leaves.find(l=>l.key===key);
  const st = getCardState(key);
  const pct = Math.round((fs.pos/fs.queue.length)*100);

  app.innerHTML = headHtml + `
    <div class="flash-wrap">
      <div class="flash-progress">
        <span class="mono">${fs.pos+1} / ${fs.queue.length}</span>
        <div class="track"><div class="track-fill" style="width:${pct}%;background:${sub.cor}"></div></div>
        <span class="mono" title="nível de repetição">caixa ${st.box}/5</span>
      </div>
      <div class="flash-card" id="flashCard" onclick="this.classList.toggle('flipped')">
        <div class="card-inner">
          <div class="card-face card-front" style="border-top:4px solid ${sub.cor}">
            <div class="flash-eyebrow">${leaf.parent}</div>
            ${leaf.t}
          </div>
          <div class="card-face card-back">${leaf.d}</div>
        </div>
      </div>
      <div class="tap-hint">toque no cartão para revelar a resposta</div>
      <div class="flash-controls">
        <button class="fbtn review" onclick="answerFlash('${sub.id}', false)">A revisar</button>
        <button class="fbtn know" onclick="answerFlash('${sub.id}', true)">Sei</button>
      </div>
      <div class="session-tally">
        <span>Sei: <b>${fs.know}</b></span>
        <span>A revisar: <b>${fs.review}</b></span>
        <span>Restam: <b>${fs.queue.length - fs.pos - 1}</b></span>
      </div>
    </div>`;
}

function answerFlash(id, knew){
  const fs = flashState[id];
  const key = fs.queue[fs.pos];
  const st = getCardState(key);
  const now = Date.now();
  if(knew){
    st.box = Math.min((st.box||0)+1, 5);
    st.due = now + BOX_DAYS[st.box]*86400000;
    st.reps = (st.reps||0)+1;
    fs.know++;
  } else {
    st.box = 1;
    st.due = now + BOX_DAYS[1]*86400000;
    st.reps = (st.reps||0)+1;
    st.lapses = (st.lapses||0)+1;
    fs.review++;
    const insertAt = Math.min(fs.pos + 3, fs.queue.length);
    fs.queue.splice(insertAt, 0, key);
  }
  setCardState(key, st);
  logStudyToday();
  fs.pos++;
  if(fs.pos >= fs.queue.length){ fs.done = true; }
  render();
}
function restartFlash(id){ initFlash(id, true); render(); }

function boot(){
  try{
    render();
  }catch(err){
    app.innerHTML = `<div style="max-width:520px;margin:60px auto;text-align:center;font-family:sans-serif;color:#9B3A34;">
      <strong>Não foi possível carregar o mapa.</strong><br>
      <span style="font-size:13px;color:#4A5570;">Erro técnico: ${String(err.message||err)}. Tente abrir este arquivo diretamente no navegador (não em uma pré-visualização embutida).</span>
    </div>`;
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
